name: Implementation
description: Track approved or otherwise well-defined implementation work
title: "[Implementation] "
labels: ["enhancement"]
body:
  - type: input
    id: drafted_by
    attributes:
      label: Drafted By
      description: Identify the human author, or the AI provider/agent and exact model that produced the initial Issue content. If the exact model is unavailable, use "<provider/agent> / model unknown"; never guess.
      placeholder: Human | ChatGPT / GPT-5.6 Sol | Claude / <model> | Gemini / <model> | Other / model unknown
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        `Drafted By` records immutable initial provenance. If another AI materially changes scope, acceptance criteria, dependencies, or other Issue-defining content, add an Issue comment beginning with `AI-Contributor: <agent/model>` and `Role: Planning`, `Role: Revision`, or `Role: Synthesis`. Record the exact model when available; otherwise use `<provider/agent> / model unknown`. Do not overwrite the original attribution. GitHub account identity records the operator, not necessarily the AI contributor.
  - type: input
    id: related_discussion
    attributes:
      label: Related Discussion
      description: Link the approved Discussion when this Issue implements a significant technical decision.
      placeholder: https://github.com/OWNER/REPO/discussions/123
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What must this Issue implement?
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: List related work that is intentionally excluded when scope boundaries matter. Leave blank when the boundary is already obvious.
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What observable conditions must be true before this Issue can close?
      placeholder: |
        - [ ] Requirement 1
        - [ ] Requirement 2
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Sequencing
      description: Link blockers or prerequisites when they exist.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What tests, checks, build, or other evidence are required?
    validations:
      required: true
